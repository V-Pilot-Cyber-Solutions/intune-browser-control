name: Publish DigiTrans browser control to Intune

on:
  workflow_dispatch:
    inputs:
      version:
        description: DigiTrans browser-policy version
        required: true
        default: DEV-7.1
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: digitrans-intune-browser-control
  cancel-in-progress: false

jobs:
  build-validate-publish:
    runs-on: windows-latest
    environment: digitrans-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build DigiTrans policy
        shell: pwsh
        run: |
          ./tools/Build-BrowserControl.ps1 `
            -TenantKey 'digitrans' `
            -Version '${{ inputs.version }}' `
            -OutputPath './output/digitrans/DigiTrans-Browser-Control-Developer.ps1'

      - name: Validate DigiTrans policy
        shell: pwsh
        run: |
          ./tools/Validate-BrowserControl.ps1 `
            -ScriptPath './output/digitrans/DigiTrans-Browser-Control-Developer.ps1'

      - name: Authenticate to DigiTrans using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify and update existing Intune script
        shell: pwsh
        env:
          INTUNE_SCRIPT_ID: ${{ vars.INTUNE_SCRIPT_ID }}
          EXPECTED_DISPLAY_NAME: ${{ vars.INTUNE_EXPECTED_DISPLAY_NAME }}
          POLICY_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $ScriptPath = Join-Path `
            -Path $env:GITHUB_WORKSPACE `
            -ChildPath 'output\digitrans\DigiTrans-Browser-Control-Developer.ps1'

          if (-not (Test-Path -LiteralPath $ScriptPath)) {
              throw "Generated script was not found: $ScriptPath"
          }

          $Token = az account get-access-token `
            --resource-type ms-graph `
            --query accessToken `
            --output tsv

          if ([System.String]::IsNullOrWhiteSpace($Token)) {
              throw 'Microsoft Graph access token was not returned.'
          }

          if ([System.String]::IsNullOrWhiteSpace($env:EXPECTED_DISPLAY_NAME)) {
              throw 'INTUNE_EXPECTED_DISPLAY_NAME is empty.'
          }

          $Headers = @{
              Authorization = "Bearer $Token"
              Accept = 'application/json'
              'Content-Type' = 'application/json'
          }

          $ScriptId = $env:INTUNE_SCRIPT_ID
          $GuidPattern = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

          if ([System.String]::IsNullOrWhiteSpace($ScriptId) -or $ScriptId -notmatch $GuidPattern) {
              Write-Host 'INTUNE_SCRIPT_ID is absent or not a GUID. Resolving the script by exact display name.'

              $ListUri = 'https://graph.microsoft.com/beta/deviceManagement/deviceManagementScripts?$select=id,displayName,fileName,lastModifiedDateTime&$top=100'
              $ListResponse = Invoke-RestMethod `
                -Method Get `
                -Uri $ListUri `
                -Headers $Headers

              $Matches = @(
                  $ListResponse.value | Where-Object {
                      $_.displayName -eq $env:EXPECTED_DISPLAY_NAME
                  }
              )

              if ($Matches.Count -eq 0) {
                  throw "No Intune Platform Script was found with display name '$env:EXPECTED_DISPLAY_NAME'."
              }

              if ($Matches.Count -gt 1) {
                  throw "More than one Intune Platform Script has display name '$env:EXPECTED_DISPLAY_NAME'. Configure INTUNE_SCRIPT_ID with the correct GUID."
              }

              $ScriptId = $Matches[0].id
              Write-Host "Resolved Intune script ID: $ScriptId"
          }

          if ($ScriptId -notmatch $GuidPattern) {
              throw "Resolved Intune script ID is not a valid GUID: '$ScriptId'"
          }

          $Uri = 'https://graph.microsoft.com/beta/deviceManagement/deviceManagementScripts/' + $ScriptId

          Write-Host 'Retrieving and verifying the existing Intune script.'
          $Current = Invoke-RestMethod `
            -Method Get `
            -Uri $Uri `
            -Headers $Headers

          if ($Current.id -ne $ScriptId) {
              throw 'Returned Intune script ID does not match the resolved script ID.'
          }

          if ($Current.displayName -ne $env:EXPECTED_DISPLAY_NAME) {
              throw "Target mismatch. Expected '$env:EXPECTED_DISPLAY_NAME', received '$($Current.displayName)'."
          }

          $ScriptBytes = [System.IO.File]::ReadAllBytes($ScriptPath)
          $ScriptContent = [System.Convert]::ToBase64String($ScriptBytes)

          if ([System.String]::IsNullOrWhiteSpace($ScriptContent)) {
              throw 'Generated Base64 script content is empty.'
          }

          $BodyObject = @{
              displayName = $Current.displayName
              description = "V Pilot GitHub-managed DigiTrans browser policy. Version: $env:POLICY_VERSION. Commit: $env:GITHUB_SHA"
              fileName = 'DigiTrans-Browser-Control-Developer.ps1'
              scriptContent = $ScriptContent
              runAsAccount = 'system'
              enforceSignatureCheck = $false
              runAs32Bit = $false
              roleScopeTagIds = @('0')
          }

          $Body = $BodyObject | ConvertTo-Json -Depth 10

          Write-Host 'Publishing the updated script to Intune.'
          $UpdatedScript = Invoke-RestMethod `
            -Method Patch `
            -Uri $Uri `
            -Headers $Headers `
            -Body $Body

          if ($UpdatedScript.displayName -ne $env:EXPECTED_DISPLAY_NAME) {
              throw 'Microsoft Graph did not return the expected script.'
          }

          Write-Host "Successfully updated Intune script: $($UpdatedScript.displayName)"
          Write-Host "Intune script ID: $($UpdatedScript.id)"
          Write-Host "Last modified: $($UpdatedScript.lastModifiedDateTime)"

          "INTUNE_RESOLVED_SCRIPT_ID=$ScriptId" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append
            
      - name: Trigger assigned device sync
        id: device_sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          ./tools/Sync-BrowserControlDevices.ps1 `
            -TenantKey 'digitrans'
            
      - name: Deployment summary
        shell: pwsh
        run: |
          "## DigiTrans Intune browser-policy deployment" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Tenant: DigiTrans" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Version: ${{ inputs.version }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Commit: $env:GITHUB_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Target script ID: $env:INTUNE_RESOLVED_SCRIPT_ID" | Add-Content $env:GITHUB_STEP_SUMMARY
