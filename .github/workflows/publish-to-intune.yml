name: Show GitHub organization and repository IDs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-identifiers:
    runs-on: ubuntu-latest

    steps:
      - name: Display immutable GitHub IDs
        shell: bash
        run: |
          echo "Organization Name: $GITHUB_REPOSITORY_OWNER"
          echo "Organization ID: $GITHUB_REPOSITORY_OWNER_ID"
          echo "Repository Name: $GITHUB_REPOSITORY"
          echo "Repository ID: $GITHUB_REPOSITORY_ID"
