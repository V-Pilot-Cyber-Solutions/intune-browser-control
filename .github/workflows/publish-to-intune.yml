name: Publish Browser control to Intune

on:
  workflow_dispatch:
    inputs:
      tenantKey:
        description: Tenant key matching a directory under tenants
        required: true
        default: digitrans
        type: string

      version:
        description: Browser-policy version
        required: true
        default: DEV-9.6
        type: string

      targetEnvironment:
        description: GitHub environment containing the tenant configuration
        required: true
        default: digitrans-production
        type: environment

permissions:
  contents: read
  id-token: write

concurrency:
  group: intune-browser-control-${{ inputs.tenantKey }}
  cancel-in-progress: false

jobs:
  build-validate-publish:
    name: Build, validate, publish, and sync
    runs-on: windows-latest
    environment: ${{ inputs.targetEnvironment }}

    env:
      TENANT_KEY: ${{ inputs.tenantKey }}
      POLICY_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check workflow for copy-paste corruption
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $WorkflowPath = Join-Path `
              -Path $env:GITHUB_WORKSPACE `
              -ChildPath '.github\workflows\publish-to-intune.yml'

          $Content = Get-Content `
              -LiteralPath $WorkflowPath `
              -Raw `
              -Encoding UTF8

          # Build signatures from fragments so this workflow does not contain
          # the exact invalid strings that the check is intended to detect.
          $Colon = ':'
          $InvalidFragments = @(
              (' ' + $Colon + 'IsNullOrWhiteSpace')
              ('= ' + $Colon + 'ToBase64String')
              ('= ' + $Colon + 'FromBase64String')
              ('= ' + $Colon + 'ToHexString')
              ('= ' + $Colon + 'HashData')
              ('<' + 'a href=')
              ('<' + '/a>')
              ('<' + 'br>')
              ('&' + 'lt;')
              ('&' + 'gt;')
          )

          foreach ($Fragment in $InvalidFragments) {
              if ($Content.Contains($Fragment)) {
                  throw "Invalid workflow content detected: $Fragment"
              }
          }

          Write-Host 'Workflow copy-paste corruption check passed.'

      - name: Validate workflow inputs
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if ($env:TENANT_KEY -notmatch '^[a-z0-9-]+$') {
              throw "Invalid tenant key: $env:TENANT_KEY"
          }

          if ($env:POLICY_VERSION -notmatch '^[A-Za-z0-9._-]+$') {
              throw "Invalid policy version: $env:POLICY_VERSION"
          }

          $TenantRoot = Join-Path `
              -Path $env:GITHUB_WORKSPACE `
              -ChildPath "tenants\$env:TENANT_KEY"

          $TenantJsonPath = Join-Path `
              -Path $TenantRoot `
              -ChildPath 'tenant.json'

          if (-not (Test-Path -LiteralPath $TenantJsonPath)) {
              throw "Tenant metadata was not found: $TenantJsonPath"
          }

      - name: Load tenant metadata
        id: tenant
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $TenantJsonPath = Join-Path `
              -Path $env:GITHUB_WORKSPACE `
              -ChildPath "tenants\$env:TENANT_KEY\tenant.json"

          $Tenant = Get-Content `
              -LiteralPath $TenantJsonPath `
              -Raw `
              -Encoding UTF8 |
                  ConvertFrom-Json -ErrorAction Stop

          if ([string]$Tenant.tenantKey -ne $env:TENANT_KEY) {
              throw 'Tenant key mismatch in tenant.json.'
          }

          if ([string]::IsNullOrWhiteSpace([string]$Tenant.organizationName)) {
              throw 'organizationName is missing from tenant.json.'
          }

          if ([string]::IsNullOrWhiteSpace([string]$Tenant.intuneFileName)) {
              throw 'intuneFileName is missing from tenant.json.'
          }

          $OutputDirectory = Join-Path `
              -Path $env:GITHUB_WORKSPACE `
              -ChildPath "output\$env:TENANT_KEY"

          $OutputPath = Join-Path `
              -Path $OutputDirectory `
              -ChildPath ([string]$Tenant.intuneFileName)

          "organizationName=$($Tenant.organizationName)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "intuneFileName=$($Tenant.intuneFileName)" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          "outputPath=$OutputPath" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Tenant: $($Tenant.organizationName)"
          Write-Host "Output: $OutputPath"

      - name: Build tenant policy
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          ./tools/Build-BrowserControl.ps1 `
              -TenantKey $env:TENANT_KEY `
              -Version $env:POLICY_VERSION `
              -OutputPath '${{ steps.tenant.outputs.outputPath }}'

      - name: Validate tenant policy
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          ./tools/Validate-BrowserControl.ps1 `
              -ScriptPath '${{ steps.tenant.outputs.outputPath }}'

      - name: Verify publishing prerequisites
        shell: pwsh
        env:
          INTUNE_SCRIPT_ID: ${{ vars.INTUNE_SCRIPT_ID }}
          EXPECTED_DISPLAY_NAME: ${{ vars.INTUNE_EXPECTED_DISPLAY_NAME }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $GuidPattern = (
              '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-' +
              '[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-' +
              '[0-9a-fA-F]{12}$'
          )

          if (
              [string]::IsNullOrWhiteSpace($env:INTUNE_SCRIPT_ID) -or
              $env:INTUNE_SCRIPT_ID -notmatch $GuidPattern
          ) {
              throw 'INTUNE_SCRIPT_ID is missing or invalid.'
          }

          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_DISPLAY_NAME)) {
              throw 'INTUNE_EXPECTED_DISPLAY_NAME is empty.'
          }

          if (
              [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID) -or
              $env:AZURE_CLIENT_ID -notmatch $GuidPattern
          ) {
              throw 'AZURE_CLIENT_ID is missing or invalid.'
          }

          if (
              [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID) -or
              $env:AZURE_TENANT_ID -notmatch $GuidPattern
          ) {
              throw 'AZURE_TENANT_ID is missing or invalid.'
          }

          Write-Host 'Publishing prerequisites passed.'
          Write-Host "Intune script ID: $env:INTUNE_SCRIPT_ID"
          Write-Host "Expected display name: $env:EXPECTED_DISPLAY_NAME"

      - name: Authenticate to tenant using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Verify and update existing Intune script
        id: publish
        shell: pwsh
        env:
          INTUNE_SCRIPT_ID: ${{ vars.INTUNE_SCRIPT_ID }}
          EXPECTED_DISPLAY_NAME: ${{ vars.INTUNE_EXPECTED_DISPLAY_NAME }}
          GENERATED_SCRIPT_PATH: ${{ steps.tenant.outputs.outputPath }}
          GENERATED_FILE_NAME: ${{ steps.tenant.outputs.intuneFileName }}
          ORGANIZATION_NAME: ${{ steps.tenant.outputs.organizationName }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath $env:GENERATED_SCRIPT_PATH)) {
              throw "Generated script was not found: $env:GENERATED_SCRIPT_PATH"
          }

          $GuidPattern = (
              '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-' +
              '[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-' +
              '[0-9a-fA-F]{12}$'
          )

          if (
              [string]::IsNullOrWhiteSpace($env:INTUNE_SCRIPT_ID) -or
              $env:INTUNE_SCRIPT_ID -notmatch $GuidPattern
          ) {
              throw (
                  'INTUNE_SCRIPT_ID must be configured as a valid GUID ' +
                  'in the selected GitHub environment.'
              )
          }

          if ([string]::IsNullOrWhiteSpace($env:EXPECTED_DISPLAY_NAME)) {
              throw (
                  'INTUNE_EXPECTED_DISPLAY_NAME is missing from the ' +
                  'selected GitHub environment.'
              )
          }

          if ([string]::IsNullOrWhiteSpace($env:GENERATED_FILE_NAME)) {
              throw 'The generated Intune filename is empty.'
          }

          $Token = az account get-access-token `
              --resource-type ms-graph `
              --query accessToken `
              --output tsv

          if (
              $LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($Token)
          ) {
              throw 'Microsoft Graph access token was not returned.'
          }

          $Headers = @{
              Authorization  = "Bearer $Token"
              Accept         = 'application/json'
              'Content-Type' = 'application/json'
          }

          $ScriptId = $env:INTUNE_SCRIPT_ID
          $ScriptUri = (
              'https://graph.microsoft.com/beta/' +
              'deviceManagement/deviceManagementScripts/' +
              $ScriptId
          )

          Write-Host 'Retrieving existing Intune script.'

          $Current = Invoke-RestMethod `
              -Method Get `
              -Uri $ScriptUri `
              -Headers $Headers

          if ([string]$Current.id -ne $ScriptId) {
              throw 'Returned Intune script ID does not match.'
          }

          if ([string]$Current.displayName -ne $env:EXPECTED_DISPLAY_NAME) {
              throw (
                  "Target mismatch. Expected '$env:EXPECTED_DISPLAY_NAME'; " +
                  "received '$($Current.displayName)'."
              )
          }

          [byte[]]$ScriptBytes = [System.IO.File]::ReadAllBytes(
              $env:GENERATED_SCRIPT_PATH
          )

          if ($ScriptBytes.Length -eq 0) {
              throw 'Generated script is empty.'
          }

          $ScriptContent = [Convert]::ToBase64String($ScriptBytes)

          if ([string]::IsNullOrWhiteSpace($ScriptContent)) {
              throw 'Generated Base64 script content is empty.'
          }

          $Description = (
              'GitHub-managed {0} browser policy. ' +
              'TenantKey: {1}. Version: {2}. Commit: {3}' -f
              $env:ORGANIZATION_NAME,
              $env:TENANT_KEY,
              $env:POLICY_VERSION,
              $env:GITHUB_SHA
          )

          $BodyObject = @{
              displayName           = [string]$Current.displayName
              description           = $Description
              fileName              = $env:GENERATED_FILE_NAME
              scriptContent         = $ScriptContent
              runAsAccount          = 'system'
              enforceSignatureCheck = $false
              runAs32Bit            = $false
              roleScopeTagIds       = @('0')
          }

          $Body = $BodyObject | ConvertTo-Json -Depth 10

          Write-Host 'Publishing updated script to Intune.'

          Invoke-RestMethod `
              -Method Patch `
              -Uri $ScriptUri `
              -Headers $Headers `
              -Body $Body |
                  Out-Null

          Write-Host 'Retrieving script after publication.'

          $Published = Invoke-RestMethod `
              -Method Get `
              -Uri $ScriptUri `
              -Headers $Headers

          if ([string]$Published.displayName -ne $env:EXPECTED_DISPLAY_NAME) {
              throw 'Published script display-name verification failed.'
          }

          if ([string]$Published.fileName -ne $env:GENERATED_FILE_NAME) {
              throw 'Published script filename verification failed.'
          }

          $LocalHashBytes = [Security.Cryptography.SHA256]::HashData(
              $ScriptBytes
          )

          $LocalHash = [Convert]::ToHexString(
              $LocalHashBytes
          ).ToLowerInvariant()

          $ScriptContentProperty = $Published.PSObject.Properties[
              'scriptContent'
          ]

          if (
              $null -ne $ScriptContentProperty -and
              -not [string]::IsNullOrWhiteSpace(
                  [string]$Published.scriptContent
              )
          ) {
              [byte[]]$StoredBytes = [Convert]::FromBase64String(
                  [string]$Published.scriptContent
              )

              $StoredHashBytes = [Security.Cryptography.SHA256]::HashData(
                  $StoredBytes
              )

              $StoredHash = [Convert]::ToHexString(
                  $StoredHashBytes
              ).ToLowerInvariant()

              if ($LocalHash -ne $StoredHash) {
                  throw (
                      'Intune stored script does not match the generated ' +
                      "script. Local=$LocalHash; Stored=$StoredHash"
                  )
              }

              Write-Host 'Stored script hash verification passed.'
              Write-Host "Stored SHA256: $StoredHash"
          }
          else {
              Write-Warning (
                  'Microsoft Graph did not return scriptContent during ' +
                  'the verification GET. Metadata verification passed.'
              )
          }

          Write-Host (
              'Successfully updated Intune script: {0}' -f
              $Published.displayName
          )
          Write-Host "Intune script ID: $ScriptId"
          Write-Host "Local SHA256: $LocalHash"
          Write-Host (
              'Last modified: {0}' -f
              $Published.lastModifiedDateTime
          )

          "INTUNE_RESOLVED_SCRIPT_ID=$ScriptId" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          "scriptId=$ScriptId" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "localHash=$LocalHash" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

      - name: Trigger assigned device sync
        id: device_sync
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          ./tools/Sync-BrowserControlDevices.ps1 `
              -TenantKey $env:TENANT_KEY

      - name: Deployment summary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $ScriptId = $env:INTUNE_RESOLVED_SCRIPT_ID

          if ([string]::IsNullOrWhiteSpace($ScriptId)) {
              $ScriptId = 'Not published'
          }

          $GeneratedHash = '${{ steps.publish.outputs.localHash }}'

          if ([string]::IsNullOrWhiteSpace($GeneratedHash)) {
              $GeneratedHash = 'Not available'
          }

          $DeviceSyncOutcome = '${{ steps.device_sync.outcome }}'

          if ([string]::IsNullOrWhiteSpace($DeviceSyncOutcome)) {
              $DeviceSyncOutcome = 'not-run'
          }

          "## Intune browser-policy deployment" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Tenant key: $env:TENANT_KEY" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Organization: ${{ steps.tenant.outputs.organizationName }}" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- GitHub environment: ${{ inputs.targetEnvironment }}" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Version: $env:POLICY_VERSION" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Commit: $env:GITHUB_SHA" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Target script ID: $ScriptId" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Generated SHA256: $GeneratedHash" |
              Add-Content $env:GITHUB_STEP_SUMMARY

          "- Device sync step: $DeviceSyncOutcome" |
              Add-Content $env:GITHUB_STEP_SUMMARY
